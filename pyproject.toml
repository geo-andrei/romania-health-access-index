[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hai"
version = "0.1.0"
description = "Healthcare Accessibility Index for Romania: open data to OGC API - Features"
requires-python = ">=3.11"

[project.scripts]
hai = "hai.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
